<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Appli Muscu">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Appli Muscu</title>
<style>
:root{
  --bg:#0f1115; --card:#181b22; --card2:#20242d; --line:#2b303b;
  --text:#eceef4; --muted:#8d95a8; --accent:#ff6b35; --accent2:#ff8a5c;
  --good:#3ecf8e; --bad:#ef5b5b; --shadow:0 6px 18px rgba(0,0,0,.28); --onacc:#1a0d06; --navbg:rgba(15,17,21,.96);
}
html[data-theme="light"]{
  --bg:#f4f5f8; --card:#ffffff; --card2:#eceef3; --line:#d9dce5;
  --text:#171a22; --muted:#5d6579; --accent:#ec5a22; --accent2:#c9440f;
  --good:#1fa56b; --bad:#d43b3b; --shadow:0 4px 14px rgba(20,25,40,.10); --onacc:#ffffff; --navbg:rgba(255,255,255,.96);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px}
body{padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 150px);max-width:640px;margin:0 auto}
body.resting{padding-bottom:calc(env(safe-area-inset-bottom) + 270px)}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
#sync{display:none}
h1{font-size:22px;margin:0;letter-spacing:.2px}
h2{font-size:15px;margin:18px 0 8px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.chip{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 9px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card.hl{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 8px 22px rgba(255,107,53,.18)}
.card.okc{border-color:var(--good);box-shadow:0 0 0 1px var(--good)}
.exh{display:flex;align-items:center;gap:10px;min-width:0}
.exh .ei{font-size:26px;width:44px;height:44px;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex:none}
.exh .en{font-size:19px;font-weight:700;line-height:1.2}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:14px}
.b{font-weight:650}
button{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 16px;min-height:48px;cursor:pointer}
button:active{transform:scale(.98)}
button.primary{background:linear-gradient(135deg,var(--accent2),var(--accent));border-color:var(--accent);color:var(--onacc);font-weight:700;box-shadow:0 4px 14px rgba(255,107,53,.30)}
button.ghost{background:transparent}
button.danger{color:var(--bad)}
button.full{width:100%}
button.sm{padding:8px 13px;font-size:15px;border-radius:11px;min-height:42px}
input,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:13px;width:100%;min-width:0;min-height:48px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.sets{display:grid;grid-template-columns:30px 1fr 1fr 58px;gap:10px;align-items:center;margin:12px 0}
.sets .hd{font-size:12px;color:var(--muted);text-transform:uppercase;text-align:center}
.sets input{text-align:center;font-size:24px;font-weight:650;padding:10px 4px;min-height:56px}
.sets .n{text-align:center;color:var(--muted);font-size:18px;font-weight:650}
.chk{padding:0;height:56px;font-size:26px;border-radius:14px}
.chk.on{background:var(--good);border-color:var(--good);color:#06281a}
.setrow-done input{opacity:.65}
.hint{font-size:13px;color:var(--muted);margin:4px 0 0}
.hint .up{color:var(--accent2);font-weight:600}
.days{display:grid;gap:10px}
.pill{display:inline-block;background:var(--card2);border-radius:99px;padding:4px 11px;font-size:14px;font-weight:650;color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat .v{font-size:24px;font-weight:700}
.stat .l{font-size:11px;color:var(--muted);margin-top:2px}
.bar{height:10px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:22px 8px;font-size:14px}
.pe{display:grid;grid-template-columns:1fr 54px 78px 36px;gap:6px;margin-bottom:6px;align-items:center}
.pe input{padding:8px;font-size:14px}
.pe button{padding:6px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--navbg);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);z-index:5}
nav button{flex:1;background:transparent;border:0;color:var(--muted);font-size:12px;padding:6px 2px;border-radius:10px;min-height:56px}
nav button .ic{display:block;font-size:25px;margin-bottom:2px}
nav button.on{color:var(--accent);font-weight:700}
#rest{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 76px);background:linear-gradient(135deg,var(--accent2),var(--accent));color:var(--onacc);border-radius:20px;padding:12px 16px 14px;display:none;flex-direction:column;gap:10px;z-index:6;font-weight:700;box-shadow:0 10px 28px rgba(0,0,0,.40)}
#rest .rtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
#rest .rlab{font-size:14px;opacity:.85}
#rest .rbig{font-size:46px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px}
#rest .rbtn{display:flex;gap:8px}
#rest .rbar{height:8px;border-radius:99px;background:rgba(0,0,0,.22);overflow:hidden}
#rest .rbar i{display:block;height:100%;width:100%;background:var(--onacc);opacity:.85;border-radius:99px;transition:width .5s linear}
#rest button{background:rgba(0,0,0,.22);border:0;color:var(--onacc);padding:10px 14px;min-height:46px;font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 10px);background:var(--card2);border:1px solid var(--accent);padding:10px 16px;border-radius:12px;z-index:9;display:none;max-width:90%;text-align:center;font-size:14px}
svg text{fill:var(--muted);font-size:10px}
.tip{font-size:15px;margin:8px 0 10px;padding:12px 14px;background:var(--card2);border-radius:12px;border-left:4px solid var(--accent);line-height:1.45}
details.card summary{cursor:pointer;font-weight:650;list-style:none}
details.card ol{margin:10px 0 0;padding-left:20px;font-size:14px;line-height:1.5;color:var(--muted)}
details.card ol b{color:var(--text)}
.note{margin-top:8px;font-size:13px;padding:7px 9px}
details.how{margin:8px 0 0;background:var(--card2);border-radius:10px;padding:8px 10px;font-size:13px}
details.how summary{cursor:pointer;font-weight:650;color:var(--accent2)}
details.how p{margin:8px 0 0;line-height:1.45;color:var(--muted)}
details.how p b{color:var(--text)}
details.how a{color:var(--accent2);font-weight:650}
.dow{width:58px;flex:none}
.how ul.q{margin:8px 0 0;padding-left:18px;line-height:1.55;color:var(--text)}
.how details.more{margin-top:8px}
.how details.more summary{color:var(--muted);font-weight:600}
.stp{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.stp span{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--card2);color:var(--muted)}
.stp span.cur{background:var(--accent);color:#1a0d06;font-weight:700}
.stp span.ok{color:var(--good)}
.ok{color:var(--good)}
.late{color:var(--bad)}
.cele{text-align:center;font-size:34px;letter-spacing:6px;animation:pop .7s ease-out 1}
.cele span{display:inline-block;animation:bounce 1.2s ease-in-out infinite}
.cele span:nth-child(2){animation-delay:.15s}.cele span:nth-child(3){animation-delay:.3s}
.celeT{text-align:center;font-weight:800;font-size:19px;color:var(--accent2);margin:2px 0 10px}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.big{font-size:34px;font-weight:800;color:var(--accent2);line-height:1.1}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--onacc);font-weight:700}
label.f{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>
<body>
<header>
  <h1>💪 Appli Muscu</h1>
  <span class="chip" id="sync">chargement…</span>
</header>
<main id="view"></main>
<div id="rest"><div class="rtop"><div><div id="restLab" class="rlab">Repos</div><div id="restBig" class="rbig">1:00</div></div><div class="rbtn"><button data-act="restAdd">+30 s</button><button data-act="restStop">Passer</button></div></div><div class="rbar"><i id="restFill"></i></div></div>
<div id="toast"></div>
<nav id="tabs">
  <button data-act="tab" data-tab="today"><span class="ic">🏋️</span>Séance</button>
  <button data-act="tab" data-tab="cal"><span class="ic">📅</span>Planning</button>
  <button data-act="tab" data-tab="progress"><span class="ic">📈</span>Progrès</button>
  <button data-act="tab" data-tab="body"><span class="ic">⚖️</span>Corps</button>
  <button data-act="tab" data-tab="prog"><span class="ic">👤</span>Profil</button>
</nav>

<script>
(function(){
"use strict";

/* ---------- utilitaires ---------- */
var $ = function(s){return document.querySelector(s);};
var uid = function(){return Math.random().toString(36).slice(2,9);};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function num(v){var n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n;}
function fmt(n){return String(Math.round(n*10)/10).replace('.',',');}
function ymd(d){var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;}
function fmtDate(s){var d=new Date(s.length<=10?s+'T12:00:00':s);return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});}
function norm(s){return String(s).trim().toLowerCase();}
function minRep(reps){var m=String(reps).match(/\d+/);return m?parseInt(m[0],10):0;}
function maxRep(reps){var m=String(reps).match(/\d+/g);return m?parseInt(m[m.length-1],10):0;}
function e1rm(w,r){return w>0?w*(1+r/30):0;}
function weekStart(){var d=new Date();d.setHours(0,0,0,0);var day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d;}

/* ---------- état ---------- */
function ex(name,sets,reps){return {id:uid(),name:name,sets:sets,reps:reps};}
var ALT={
 'presse à cuisses':['Squat à la Smith machine','Squat goblet haltère'],
 'leg extension':['Fentes avec haltères','Squat goblet haltère'],
 'leg curl assis':['Leg curl allongé','Soulevé de terre roumain haltères'],
 'mollets à la presse':['Mollets debout machine','Mollets debout haltères'],
 'abducteurs machine':['Abduction à la poulie','Marche latérale avec élastique'],
 'développé couché machine':['Développé couché haltères','Développé couché Smith machine'],
 'développé incliné machine':['Développé incliné haltères','Pompes inclinées'],
 'pec deck':['Écarté poulies vis-à-vis','Écarté haltères'],
 'développé épaules machine':['Développé épaules haltères','Développé épaules Smith machine'],
 'élévations latérales machine':['Élévations latérales haltères','Élévations latérales poulie'],
 'extension triceps poulie':['Extension triceps haltère','Dips sur banc'],
 'tirage vertical':['Tirage poitrine poulie haute','Tractions assistées'],
 'rowing machine':['Rowing haltère un bras','Tirage horizontal poulie'],
 'tirage horizontal poulie':['Rowing haltère un bras','Rowing machine'],
 'curl biceps machine':['Curl haltères','Curl poulie basse'],
 'crunch machine':['Crunch au sol','Crunch poulie haute']
};
function nmach(){S.noMach=S.noMach||{};return S.noMach;}
function resolveEx(name){
  var k=norm(name); if(!nmach()[k]) return name;
  var a=ALT[k]||[]; for(var i=0;i<a.length;i++){ if(!nmach()[norm(a[i])]) return a[i]; }
  return name;
}
function applyAvail(prog){
  Object.keys(prog).forEach(function(k){
    var seen={}, out=[];
    prog[k].ex.forEach(function(e){
      var n=resolveEx(e.name), nk=norm(n);
      if(seen[nk]) return; seen[nk]=1; e.name=n; out.push(e);
    });
    prog[k].ex=out;
  });
  return prog;
}
var DAYMAP={2:[0,3],3:[0,2,4],4:[0,1,3,4],5:[0,1,2,3,4]};
function buildProgram(goal,level,days){
  var lose=goal==='lose', muscle=goal==='muscle', inter=!!level&&level!=='novice';
  var main=lose?'12-15':(muscle?'8-12':'10-12'), iso=lose?'15':'12-15', sm=inter?4:3;
  function M(n){return ex(n,sm,main);}
  function I(n){return ex(n,3,iso);}
  var note='Échauffe-toi 5 min, puis finis par le cardio.';
  var jambes=[M('Presse à cuisses'),I('Leg extension'),I('Leg curl assis'),I('Mollets à la presse')].concat(inter?[I('Abducteurs machine')]:[]);
  var pecs=[M('Développé couché machine')].concat(inter?[M('Développé incliné machine')]:[]).concat([I('Pec deck'),M('Développé épaules machine'),I('Élévations latérales machine')]);
  var dos=[M('Tirage vertical'),M('Rowing machine')].concat(inter?[M('Tirage horizontal poulie')]:[]).concat([I('Curl biceps machine'),I('Crunch machine')]);
  var sess;
  if(days<=2){
    sess=[['Séance Jambes & Pectoraux',[M('Presse à cuisses'),I('Leg curl assis'),M('Développé couché machine'),I('Pec deck'),I('Crunch machine')].concat(inter?[I('Abducteurs machine')]:[])],
          ['Séance Dos & Épaules',[M('Tirage vertical'),M('Rowing machine'),M('Développé épaules machine'),I('Élévations latérales machine'),I('Curl biceps machine')].concat(inter?[I('Mollets à la presse')]:[])]];
  } else if(days===3){
    sess=[['Séance Jambes & Pectoraux',[M('Presse à cuisses'),I('Leg curl assis'),M('Développé couché machine'),I('Pec deck'),I('Mollets à la presse')]],
          ['Séance Dos & Épaules',[M('Tirage vertical'),M('Rowing machine'),M('Développé épaules machine'),I('Élévations latérales machine'),I('Curl biceps machine')]],
          ['Séance Corps entier',[M('Presse à cuisses'),M('Développé couché machine'),M('Tirage vertical'),I('Leg extension')].concat(inter?[I('Extension triceps poulie')]:[]).concat([I('Crunch machine')])]];
  } else {
    sess=[['Séance Jambes',jambes],
      ['Séance Pectoraux & Triceps',[M('Développé couché machine')].concat(inter?[M('Développé incliné machine')]:[]).concat([I('Pec deck'),I('Extension triceps poulie')])],
      ['Séance Dos & Biceps',[M('Tirage vertical'),M('Rowing machine')].concat(inter?[M('Tirage horizontal poulie')]:[]).concat([I('Curl biceps machine')])],
      ['Séance Épaules & Abdos',[M('Développé épaules machine'),I('Élévations latérales machine'),I('Crunch machine'),I('Mollets à la presse')]]];
    if(days>=5) sess.push(['Séance Jambes & Fessiers',[M('Presse à cuisses'),I('Leg curl assis'),I('Abducteurs machine'),I('Leg extension')]]);
  }
  var out={}, keys=['A','B','C','D','E'];
  sess.forEach(function(x,i){out[keys[i]]={name:x[0],note:note,ex:x[1]};});
  return (typeof S!=='undefined'&&S)?applyAvail(out):out;
}
function defaultProgram(){
  var pr=(typeof S!=='undefined'&&S&&S.profile)||{};
  var nd=(typeof S!=='undefined'&&S&&S.plan&&S.plan.days)?S.plan.days.length:3;
  return buildProgram(pr.goal||'both',pr.level||'novice',nd);
}
function defaultState(){
  return {v:1,updated:0,rest:90,perWeek:3,targetWeight:'',sel:'',program:defaultProgram(),sessions:[],body:[],comp:[],acts:[],theme:'dark',seeded:false,cm:'w',progV:0,notes:{},tm:{speed:5.5,inc:6,type:'tapis',level:'mod'},summary:null,moves:{},over:{},profile:{name:'',goal:'both',level:'novice',height:'',injuries:''},onboarded:false,lastBackup:0,phase:'prog',rest1:60,rest2:120,cardioMin:30,extras:{},plan:{weeks:8,start:ymd(new Date()),days:[0,2,4]},draft:null};
}
var SEED_ROWS=[];
function ensureSeed(){
  var changed=false;
  if((S.progV||0)<4){ if(!S.sessions.length) S.program=defaultProgram(); S.progV=4; changed=true; }
  if(!S.plan||!S.plan.start){ S.plan=Object.assign({weeks:8,days:[0,2,4]},S.plan||{}); S.plan.start=ymd(new Date()); changed=true; }
  if(S.seeded) return changed;
  S.comp=SEED_ROWS.map(function(r){return {id:uid(),date:r[0],w:r[1],fat:r[2],pct:r[3],mus:r[4],abd:r[5],visc:r[6]};});
  S.seeded=true;
  return true;
}
var S = defaultState();
var tab = 'today';
var armed = null, armedTimer = null;
var restEnd = 0, restTot = 60;

/* ---------- stockage : base de l'artefact si dispo, sinon cet appareil ---------- */
var LS_KEY = 'appli-muscu-v1';
var ref = null, saveTimer = null, syncMsg = 'sur cet appareil';
function setSync(m){syncMsg=m;var el=$('#sync');if(el)el.textContent=m;}
function lsLoad(){try{var t=localStorage.getItem(LS_KEY);return t?JSON.parse(t):null;}catch(e){return null;}}
function lsSave(){try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}}
function save(){
  S.updated = Date.now();
  lsSave();
  if(ref){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      try{
        var p = ref.set({json:JSON.stringify(S)});
        if(p && p.then){p.then(function(){setSync('☁ synchronisé');},function(){setSync('sur cet appareil');});}
        else setSync('☁ synchronisé');
      }catch(e){setSync('sur cet appareil');}
    },700);
  }
}
function merge(obj){
  if(!obj||typeof obj!=='object')return;
  var d=defaultState();
  for(var k in d){ if(obj[k]!==undefined) d[k]=obj[k]; }
  S=d;
}
async function initStore(){
  var local = lsLoad();
  if(local) merge(local);
  var dirty = ensureSeed();
  setSync('sur cet appareil');
  render();
  try{
    if(window.claude && window.claude.use){
      var dbn = await window.claude.use('db');
      var user = await window.claude.use('user');
      if(dbn && user){
        var id = await user.id();
        ref = dbn.collection('data/users/'+id).doc('state');
        var snap = await ref.get();
        var data = snap && (typeof snap.data==='function' ? snap.data() : snap);
        var exists = snap && (typeof snap.exists==='function' ? snap.exists() : (snap.exists!==undefined ? snap.exists : !!data));
        var remote = null;
        if(exists && data && data.json){ try{remote=JSON.parse(data.json);}catch(e){} }
        if(remote && (remote.updated||0) > (S.updated||0)){ merge(remote); dirty = ensureSeed() || dirty; lsSave(); }
        else if(!dirty && S.updated){ ref.set({json:JSON.stringify(S)}); }
        setSync('\u2601 synchronis\u00e9');
      }
    }
  }catch(e){ ref=null; setSync('sur cet appareil'); }
  if(dirty) save();
  render();
}

/* ---------- historique ---------- */
function lastInfo(name,reps){
  var key = norm(name);
  for(var i=S.sessions.length-1;i>=0;i--){
    var logs = S.sessions[i].logs;
    for(var j=0;j<logs.length;j++){
      if(norm(logs[j].name)===key && logs[j].sets.length){
        var sets = logs[j].sets, top = 0, all = true, low = true, mx = maxRep(reps), mn = minRep(reps);
        sets.forEach(function(s){ if(s.w>top) top=s.w; if(!(mx && s.r>=mx)) all=false; if(!(mn && s.r<mn)) low=false; });
        var bump = all && top>0, down = !bump && low && top>2.5;
        return {date:S.sessions[i].date, sets:sets, top:top, bump:bump, down:down, suggW: bump ? top+2.5 : (down ? top-2.5 : top)};
      }
    }
  }
  return null;
}
function bestBefore(name){
  var key = norm(name), best = 0;
  S.sessions.forEach(function(se){ se.logs.forEach(function(l){ if(norm(l.name)===key) l.sets.forEach(function(s){ best=Math.max(best,e1rm(s.w,s.r)); }); }); });
  return best;
}
function progKeys(){return Object.keys(S.program).filter(function(k){return k!=='BONUS';});}
function ensureBonus(){

function lastTime(k){var t=0;S.sessions.forEach(function(x){if(x.day===k){var d=new Date(x.date).getTime();if(d>t)t=d;}});return t;}
function nextDay(){
  var keys=progKeys(); if(!keys.length) return 'A';
  if(!S.sessions.length) return keys[0];

function muscles(name){
  var n=String(name||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''), m={};
  if(n.indexOf('corps entier')>=0){m.jambes=m.pecs=m.dos=m.epaules=1;return m;}
  if(n.indexOf('jambes')>=0||n.indexOf('fessiers')>=0) m.jambes=1;
  if(n.indexOf('pectoraux')>=0) m.pecs=1;
  if(/\bdos\b/.test(n)) m.dos=1;
  if(n.indexOf('epaules')>=0) m.epaules=1;
  if(n.indexOf('biceps')>=0||n.indexOf('triceps')>=0||n.indexOf('bras')>=0) m.bras=1;
  if(n.indexOf('abdos')>=0) m.abdos=1;
  return m;
}
var MLAB={jambes:'jambes',pecs:'pectoraux',dos:'dos',epaules:'épaules'};
function overlaps(a,b){for(var k in a){if(b[k]) return true;}return false;}
function agoTxt(t){
  if(!t) return 'pas encore faite';
  var d0=new Date(t);d0.setHours(0,0,0,0);var n=new Date();n.setHours(0,0,0,0);
  var d=Math.round((n-d0)/86400000);
  return d<=0?'aujourd’hui':(d===1?'hier':'il y a '+d+' jours');
}
function weekCover(){
  var ws=weekStart().getTime(), cov={}, wd=0;
  S.sessions.forEach(function(x){ if(new Date(x.date).getTime()>=ws){wd++; var pn=S.program[x.day]?S.program[x.day].name:x.day; var m=muscles(pn); for(var k in m) cov[k]=1;} });
  return {cov:cov,wd:wd};
}
function coverHtml(p){
  var wc=weekCover(); if(!wc.wd) return '';
  var miss=Object.keys(MLAB).filter(function(k){return !wc.cov[k];});
  var chips=Object.keys(MLAB).map(function(k){return '<span class="pill" style="'+(wc.cov[k]?'color:var(--good)':'')+'">'+(wc.cov[k]?'✓ ':'○ ')+MLAB[k]+'</span>';}).join(' ');
  var adv='';
  if(!miss.length) adv='Tous les gros muscles ont été travaillés cette semaine ✅';
  else {
    var bk=null,bn=0; progKeys().forEach(function(k){var m=muscles(S.program[k].name),c=0;miss.forEach(function(x){if(m[x])c++;}); if(c>bn){bn=c;bk=k;}});
    adv='À travailler : <b>'+miss.map(function(k){return MLAB[k];}).join(', ')+'</b>'+(bk?' → conseillé : <b>'+esc(S.program[bk].name)+'</b>':'');
  }
  var warn='';
  if(S.sessions.length){
    var ls=S.sessions[S.sessions.length-1], hrs=(Date.now()-new Date(ls.date).getTime())/3600000;
    var lname=S.program[ls.day]?S.program[ls.day].name:ls.day;
    if(hrs<48&&overlaps(muscles(p.name),muscles(lname))){
      var alt=progKeys().filter(function(k){return !overlaps(muscles(S.program[k].name),muscles(lname));})[0];
      warn='<p class="small" style="margin:8px 0 0;color:var(--bad)">⚠️ Tu as déjà travaillé ces muscles '+agoTxt(new Date(ls.date).getTime())+' : laisse 48 h de repos'+(alt?' ou fais plutôt <b>'+esc(S.program[alt].name)+'</b>':'')+'.</p>';
    }
  }
  return '<div style="margin:10px 0 0">'+chips+'</div><p class="small" style="margin:8px 0 0">'+adv+'</p>'+warn;
}
function variantsOf(name){
  var k=norm(name), cap=function(x){return x.charAt(0).toUpperCase()+x.slice(1);};
  var base=null; Object.keys(ALT).forEach(function(b){ if(norm(b)===k) base=b; else if(ALT[b].some(function(a){return norm(a)===k;})) base=b; });
  if(!base) return [];
  return [cap(base)].concat(ALT[base]);
}

var toastTimer=null;
function toast(msg){var t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.style.display='none';},3200);}
function confirmTwice(key){

function bkAgo(){
  var t=S.lastBackup||0; if(!t) return 'jamais';
  var d=Math.floor((Date.now()-t)/86400000); return d<=0?'aujourd’hui':(d===1?'hier':'il y a '+d+' jours');
}
function bkNeeded(){

  var newer=S.sessions.some(function(x){return new Date(x.date).getTime()>t;});

}
function bkOk(){S.lastBackup=Date.now();save();render();toast('Sauvegarde faite ✅');}
function bkCopy(txt){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){S.lastBackup=Date.now();save();render();toast('Sauvegarde copiée : colle-la dans tes notes ou un message à toi-même.');},function(){showExp=true;render();toast('Copie le texte affiché.');});
      return;
    }
  }catch(e){}
  showExp=true;render();toast('Copie le texte affiché.');
}
function doBackup(){
  var txt=JSON.stringify(S), name='appli-muscu-sauvegarde-'+ymd(new Date())+'.json';
  var fail=function(err){ if(err&&err.name==='AbortError') return; bkCopy(txt); };
  try{
    if(navigator.canShare&&window.File){
      var f=new File([txt],name,{type:'application/json'});
      if(navigator.canShare({files:[f]})){ navigator.share({files:[f],title:'Sauvegarde Appli Muscu'}).then(bkOk,fail); return; }
    }
    if(navigator.share){ navigator.share({title:'Sauvegarde Appli Muscu',text:txt}).then(bkOk,fail); return; }
  }catch(e){}
  bkCopy(txt);
}
var restLab='Repos', showExp=false, actx=null, beepNodes=[];
function audioUnlock(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}}
function cancelBeep(){beepNodes.forEach(function(o){try{o.stop(0);}catch(e){}});beepNodes=[];}
function scheduleBeep(sec){
  cancelBeep(); if(!actx) return;
  try{
    var t0=actx.currentTime+sec;
    [0,0.3,0.6].forEach(function(d){
      var o=actx.createOscillator(), g=actx.createGain();
      o.type='sine'; o.frequency.value=988;
      g.gain.setValueAtTime(0.0001,t0+d); g.gain.exponentialRampToValueAtTime(0.5,t0+d+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+d+0.22);
      o.connect(g); g.connect(actx.destination); o.start(t0+d); o.stop(t0+d+0.25); beepNodes.push(o);
    });
  }catch(e){}
}
function startRest(sec,lab){audioUnlock();restTot=sec||60;restEnd=Date.now()+(sec||60)*1000;restLab=lab||'Repos';scheduleBeep(sec||60);updateRest();}
function restTxt(x){return x%60===0?(x/60)+' min':(x<60?x+' s':Math.floor(x/60)+' min '+(x%60)+' s');}
function updateRest(){

    restEnd=0;
    try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}
    toast('Repos terminé, on repart ! 💥');

    var m=Math.floor(left/60),s=left%60;

    var rf=$('#restFill'); if(rf) rf.style.width=Math.max(0,Math.min(100,left/(restTot||left||1)*100))+'%';
    bar.style.display='flex'; document.body.classList.add('resting');

}

/* ---------- graphique ---------- */
function chart(pts,unit,goal){
  if(pts.length<2) return '<div class="empty">Il faut au moins 2 points pour tracer la courbe.</div>';
  var W=340,H=210,pl=42,pr=14,pt=22,pb=28;
  var xs=pts.map(function(p){return p.x;}), ys=pts.map(function(p){return p.y;});
  var minx=Math.min.apply(null,xs),maxx=Math.max.apply(null,xs),miny=Math.min.apply(null,ys),maxy=Math.max.apply(null,ys);
  if(goal>0){miny=Math.min(miny,goal);maxy=Math.max(maxy,goal);}
  var pad=((maxy-miny)||1)*0.18; miny-=pad; maxy+=pad;
  function sx(x){return pl+(maxx===minx?0.5:(x-minx)/(maxx-minx))*(W-pl-pr);}
  function sy(y){return pt+(1-(y-miny)/(maxy-miny))*(H-pt-pb);}
  var g='';
  for(var i=0;i<4;i++){
    var v=miny+(maxy-miny)*i/3, y=sy(v);
    g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--line)" stroke-width="1"/><text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end" style="font-size:12px">'+fmt(v)+'</text>';
  }
  var d=pts.map(function(p,i){return (i?'L':'M')+sx(p.x).toFixed(1)+' '+sy(p.y).toFixed(1);}).join(' ');
  var base=H-pb, area=d+' L'+sx(pts[pts.length-1].x).toFixed(1)+' '+base+' L'+sx(pts[0].x).toFixed(1)+' '+base+' Z';
  var dots=pts.map(function(p){return '<circle cx="'+sx(p.x).toFixed(1)+'" cy="'+sy(p.y).toFixed(1)+'" r="4" fill="#ff6b35"/>';}).join('');
  var first=pts[0], last=pts[pts.length-1];
  var gl=goal>0?'<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+sy(goal)+'" y2="'+sy(goal)+'" stroke="#3ecf8e" stroke-width="2" stroke-dasharray="6 5"/><text x="'+(W-pr)+'" y="'+(sy(goal)-5)+'" text-anchor="end" style="fill:#3ecf8e;font-size:12px;font-weight:700">Objectif '+fmt(goal)+'</text>':'';
  var lab='<circle cx="'+sx(last.x).toFixed(1)+'" cy="'+sy(last.y).toFixed(1)+'" r="7" fill="none" stroke="#ff6b35" stroke-width="2"/><text x="'+Math.min(W-pr,sx(last.x)).toFixed(1)+'" y="'+(sy(last.y)-12).toFixed(1)+'" text-anchor="end" style="fill:var(--text);font-size:14px;font-weight:800">'+fmt(last.y)+'</text>'+
          '<text x="'+sx(first.x).toFixed(1)+'" y="'+(sy(first.y)-10).toFixed(1)+'" text-anchor="start" style="font-size:12px">départ '+fmt(first.y)+'</text>';
  var f=new Date(minx).toLocaleDateString('fr-FR',{day:'numeric',month:'short'}), l=new Date(maxx).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Courbe en '+esc(unit)+'"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b35" stop-opacity=".28"/><stop offset="1" stop-color="#ff6b35" stop-opacity="0"/></linearGradient></defs>'+g+gl+
    '<path d="'+area+'" fill="url(#cg)"/><path d="'+d+'" fill="none" stroke="#ff6b35" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>'+dots+lab+
    '<text x="'+pl+'" y="'+(H-7)+'" style="font-size:12px">'+f+'</text><text x="'+(W-pr)+'" y="'+(H-7)+'" text-anchor="end" style="font-size:12px">'+l+'</text></svg>';
}

var DOW=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
var calOff=0, calMove=null, calAdd=null, calAct=null, obStep=0, obW=null;
function parseYmd(x){return new Date(x+'T12:00:00');}
function addDays(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;}
function weekStartOf(d){var x=new Date(d.getTime());x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function plannedMap(){
  var pl=S.plan, out={};
  if(!pl||!pl.start||S.phase==='calib'){ var ex0=S.extras||{}; Object.keys(ex0).forEach(function(d0){out[d0]=ex0[d0];}); return out; }
  var keys=progKeys(), n=0, d=parseYmd(pl.start), end=addDays(d,(pl.weeks||8)*7);
  for(;d<end;d=addDays(d,1)){
    if((pl.days||[]).indexOf((d.getDay()+6)%7)>=0){ out[ymd(d)]=keys[n%keys.length]; n++; }
  }
  var mv=S.moves||{};
  Object.keys(mv).forEach(function(o){ if(out[o]){ var k=out[o]; delete out[o]; if(mv[o]) out[mv[o]]=k; } });
  var ov=S.over||{};
  Object.keys(ov).forEach(function(d3){ if(out[d3]&&S.program[ov[d3]]) out[d3]=ov[d3]; });
  var ex2=S.extras||{};
  Object.keys(ex2).forEach(function(d2){ out[d2]=ex2[d2]; });
  return out;
}
function doneByDate(){var o={};S.sessions.forEach(function(se){var k=ymd(new Date(se.date));(o[k]=o[k]||[]).push(se);});return o;}
function dayNameOn(k,pm,dn){ var dd=dn[k]; if(dd&&dd.length){var sd=dd[dd.length-1].day; return S.program[sd]?S.program[sd].name:sd;} var pk=pm[k]; return pk&&S.program[pk]?S.program[pk].name:''; }
function perms(a){ if(a.length<=1) return [a.slice()]; var out=[]; a.forEach(function(x,i){ var rest=a.slice(0,i).concat(a.slice(i+1)); perms(rest).forEach(function(p){out.push([x].concat(p));}); }); return out; }
/* réorganise automatiquement les séances non faites d'une semaine pour éviter les mêmes muscles deux jours de suite */
function autoReflow(anyDate){
  if(!anyDate||S.phase==='calib') return false;
  S.over=S.over||{};
  var ws=weekStartOf(parseYmd(anyDate)), today=ymd(new Date()), pm=plannedMap(), dn=doneByDate(), slots=[], i;
  for(i=0;i<7;i++){ var k=ymd(addDays(ws,i)); if(k>today && pm[k] && !(S.extras||{})[k] && !(dn[k]&&dn[k].length)) slots.push(k); }
  if(slots.length<2) return false;
  var cur=slots.map(function(k){return pm[k];}), best=null, bc=Infinity;
  perms(cur).forEach(function(pr){
    var cost=0, at={}; slots.forEach(function(k,ix){at[k]=pr[ix];});
    slots.forEach(function(k,ix){
      var nm=S.program[pr[ix]].name, prev=ymd(addDays(parseYmd(k),-1)), pn=at[prev]?S.program[at[prev]].name:dayNameOn(prev,pm,dn);
      if(pn && overlaps(muscles(nm),muscles(pn))) cost+=10;
      if(pr[ix]!==cur[ix]) cost+=1;
    });
    if(cost<bc){bc=cost;best=pr;}
  });
  var changed=false;
  slots.forEach(function(k,ix){ if(best[ix]!==cur[ix]) changed=true; S.over[k]=best[ix]; });
  return changed;
}
function reflowDates(list){
  var ch=false, seen={};
  list.forEach(function(d){ if(!d) return; var w=ymd(weekStartOf(parseYmd(d))); if(seen[w]) return; seen[w]=1; if(autoReflow(d)) ch=true; });
  return ch;
}
function planInfo(){
  if(S.phase==='calib') return {wk:0,weeks:(S.plan&&S.plan.weeks)||8,total:0,done:0,pct:0,calib:true};
  var pl=S.plan, start=parseYmd(pl.start), t=new Date(); t.setHours(12,0,0,0);
  var wk=Math.floor((t-start)/86400000/7)+1, weeks=pl.weeks||8;
  var total=Object.keys(plannedMap()).length, end=ymd(addDays(start,weeks*7));
  var done=S.sessions.filter(function(se){var k=ymd(new Date(se.date));return k>=pl.start&&k<end;}).length;
  return {wk:wk,weeks:weeks,total:total,done:done,pct:total?Math.min(100,Math.round(done/total*100)):0};
}

function moveSession(from,to){
  var o=null;
  Object.keys(S.moves).forEach(function(w){if(S.moves[w]===from)o=w;});
  if(S.extras[from]){ var k=S.extras[from]; delete S.extras[from]; if(to) S.extras[to]=k; return; }
  if(o){ if(o===to) delete S.moves[o]; else S.moves[o]=to; } else S.moves[from]=to;
}
function freeDayFrom(dateStr){

}

function nextKeyAround(date){

  ev=ev.filter(function(x){return x[0]<date;}).sort(function(a,b){return a[0]<b[0]?-1:(a[0]>b[0]?1:0);});
  if(!ev.length) return keys[0];

}

  h+='<div class="card"><h2 style="margin-top:0">Nouveau bilan InBody</h2><div class="two"><div><label class="f">Date</label><input type="date" id="cDate" value="'+ymd(new Date())+'"></div>'+
     '<div><label class="f">Poids (kg)</label><input id="cW" inputmode="decimal"></div>'+
     '<div><label class="f">Masse grasse (kg)</label><input id="cFat" inputmode="decimal"></div>'+
     '<div><label class="f">Muscle squelettique (kg)</label><input id="cMus" inputmode="decimal"></div>'+
     '<div><label class="f">Abdomen (cm)</label><input id="cAbd" inputmode="decimal"></div>'+
     '<div><label class="f">Graisse viscérale</label><input id="cVisc" inputmode="numeric"></div></div>'+
     '<p class="small muted" style="margin:10px 0">Le % de graisse est calculé automatiquement.</p>'+
     '<button class="primary full" data-act="compAdd">Enregistrer le bilan</button></div>';

  if(comp.length){
    h+='<h2>Bilans InBody</h2>';
    comp.slice(-10).reverse().forEach(function(e){
      h+='<div class="card row between"><div><span class="b">'+fmtDate(e.date)+'</span><div class="muted small" style="margin-top:3px">'+fmt(e.w)+' kg'+(e.pct!=null?' · '+fmt(e.pct)+' % gras':'')+(e.mus!=null?' · '+fmt(e.mus)+' kg muscle':'')+'</div></div>'+
         '<button class="sm danger ghost" data-act="compDel" data-id="'+e.id+'">'+(armed==='cd'+e.id?'Confirmer ?':'Suppr.')+'</button></div>';
    });
  }

  h+='<div class="card" style="margin-top:12px"><h2 style="margin-top:0">Pesée rapide</h2><div class="two"><div><label class="f">Date</label><input type="date" id="bDate" value="'+ymd(new Date())+'"></div>'+
     '<div><label class="f">Poids (kg)</label><input id="bW" inputmode="decimal" placeholder="ex. 103,5"></div></div>'+
     '<div style="margin:10px 0"><label class="f">Tour de taille (cm), optionnel</label><input id="bWaist" inputmode="decimal"></div>'+
     '<button class="full" data-act="bodyAdd">Enregistrer</button></div>';
  var tw=num(S.targetWeight), cur=ws.length?ws[ws.length-1].w:null;
  h+='<div class="card"><label class="f">Poids objectif (kg)</label><input inputmode="decimal" data-tw="1" value="'+esc(S.targetWeight)+'" placeholder="ex. 90">'+
     (tw&&cur?'<p class="small muted" style="margin:8px 0 0">Il te reste <b style="color:var(--text)">'+fmt(Math.max(0,cur-tw))+' kg</b> à perdre.</p>':'')+'</div>';
  var list=S.body.slice().sort(function(a,b){return a.date<b.date?-1:1;});
  if(list.length){
    h+='<h2>Pesées rapides</h2>';
    list.slice(-5).reverse().forEach(function(e){
      h+='<div class="card row between"><div><span class="b">'+fmtDate(e.date)+'</span><span class="muted small"> · '+(e.w!=null?fmt(e.w)+' kg':'')+(e.w!=null&&e.waist!=null?' · ':'')+(e.waist!=null?fmt(e.waist)+' cm':'')+'</span></div>'+
         '<button class="sm danger ghost" data-act="bodyDel" data-id="'+e.id+'">'+(armed==='bd'+e.id?'Confirmer ?':'Suppr.')+'</button></div>';
    });
  }
  return h;
}

function render(){
  try{ensureBonus();}catch(e){}
  try{document.documentElement.setAttribute('data-theme',S.theme==='light'?'light':'dark');var tm=document.querySelector('meta[name=theme-color]');if(tm)tm.setAttribute('content',S.theme==='light'?'#f4f5f8':'#0f1115');}catch(e){}
  if(S.phase==='calib'){S.phase='prog';if(!S.plan.start||S.plan.start>ymd(new Date()))S.plan.start=ymd(new Date());save();}
  var nav=$('#tabs');
  if(!S.onboarded){ nav.style.display='none'; $('#view').innerHTML=viewOnboard(); $('#rest').style.display='none'; return; }
  nav.style.display='flex';
  var v={today:viewToday,cal:viewCal,prog:viewProg,progress:viewProgress,body:viewBody,guide:viewGuide}[tab]();
  $('#view').innerHTML=v;
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'),function(b){b.classList.toggle('on',b.dataset.tab===tab);});
  updateRest();
}

/* ---------- actions ---------- */
function startSession(day){
  var p=S.program[day]; if(!p) return;
  tab='today'; var soft=false;
  S.draft={day:day,soft:soft,calib:S.phase==='calib',start:new Date().toISOString(),ex:p.ex.map(function(e){
    var info=lastInfo(e.name,e.reps), n=Math.max(1,parseInt(e.sets,10)||3), sets=[]; if(soft) n=Math.max(2,n-1);
    for(var i=0;i<n;i++) sets.push({w:info?String(info.suggW).replace('.',','):'',r:'',done:false});
    return {name:e.name,target:e.sets+'×'+e.reps,info:info,sets:sets};
  }),tm:{min:S.cardioMin||30,kcal:'',type:S.tm.type||'tapis'},gym:''};
  save(); render(); window.scrollTo(0,0);
}
function finishSession(){
  var d=S.draft, logs=[], prs=[];
  d.ex.forEach(function(e){
    var sets=[];
    e.sets.forEach(function(s){
      var r=parseInt(s.r,10);
      if(s.done && r>0) sets.push({w:num(s.w)||0,r:r});
    });
    if(sets.length){
      var prev=bestBefore(e.name), now=0;
      sets.forEach(function(s){now=Math.max(now,e1rm(s.w,s.r));});
      if(prev>0 && now>prev+0.01) prs.push(e.name);
      logs.push({name:e.name,sets:sets});
    }
  });
  if(!logs.length){toast('Valide au moins une série avec ✓ et des reps.');return;}
  var todayK=ymd(new Date()), pmF=plannedMap();
  var mlF=missedList().filter(function(k){return pmF[k]===d.day;});
  if(mlF.length){ moveSession(mlF[0], pmF[todayK]?'':todayK); }
  var tt=d.tm?totals(d):{wt:curWeight()||100,g:0,t:0,total:0};
  var vol=0, pvol=0; logs.forEach(function(l){l.sets.forEach(function(x){vol+=x.w*x.r;});});
  for(var qi=S.sessions.length-1;qi>=0;qi--){ if(S.sessions[qi].day===d.day){ S.sessions[qi].logs.forEach(function(l){l.sets.forEach(function(x){pvol+=x.w*x.r;});}); break; } }
  S.sessions.push({id:uid(),date:d.start,day:d.day,logs:logs,kcal:tt.total,kcalGym:tt.g,kcalTm:tt.t,cardio:d.tm?d.tm.type:'tapis'});
  if(d.tm){S.tm.type=d.tm.type||'tapis';}
  var celeb=maybeFinishCalib(), cn='';
  if(celeb) cn='🎉 Toutes tes charges sont trouvées ! Ton programme de '+S.plan.weeks+' semaines démarre le '+fmtDate(S.plan.start);
  else if(S.phase==='calib'){var cs2=calibStats();cn='🔎 Phase test : '+cs2.done+' machines testées sur '+cs2.total+'. Prochaine étape : '+nextCalibName()+'.';}
  S.summary=tt.total?{total:tt.total,g:tt.g,t:tt.t,wt:tt.wt,label:tt.label,note:cn,net:tt.net,prs:prs,vol:Math.round(vol),pvol:Math.round(pvol),n:logs.length}:null;
  S.draft=null; restEnd=0;cancelBeep(); save(); render(); window.scrollTo(0,0);
  try{if(prs.length&&navigator.vibrate)navigator.vibrate([120,60,120,60,240]);}catch(e){}
  toast(prs.length?'Séance enregistrée 💪 Record : '+prs.slice(0,2).join(', '):'Séance enregistrée 💪 Bien joué !');
}

document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]'); if(!t) return;
  if(t.tagName==='A') ev.preventDefault();
  var a=t.dataset.act, i, j;
  if(a==='tab'){tab=t.dataset.tab;render();window.scrollTo(0,0);}
  else if(a==='start'){startSession(t.dataset.day);}
  else if(a==='cancel'){if(confirmTwice('cancel')){S.draft=null;restEnd=0;cancelBeep();save();render();}}
  else if(a==='finish'){finishSession();}
  else if(a==='rest'){S.rest=parseInt(t.dataset.v,10);save();render();}
  else if(a==='restAdd'){ if(restEnd){restEnd+=30000;restTot=(restTot||60)+30;cancelBeep();scheduleBeep(Math.max(1,Math.ceil((restEnd-Date.now())/1000)));updateRest();} }
  else if(a==='restStop'){restEnd=0;cancelBeep();updateRest();}
  else if(a==='noMach'){
    i=+t.dataset.ex; var E3=S.draft.ex[i], old=E3.name, nn2=(function(){nmach()[norm(old)]=1;return resolveEx(old);})();
    if(nn2===old){toast('Pas d’alternative connue : renomme-la dans Profil.');save();render();}
    else{
      applyAvail(S.program);
      var rps=String(E3.target).split('×')[1]||'8-12', inf=lastInfo(nn2,rps);
      E3.name=nn2; E3.info=inf; E3.rated=false; E3.advice='';
      E3.sets.forEach(function(x){if(!x.done){x.w=inf?String(inf.suggW).replace('.',','):'';}});
      save();render();toast('Remplacée par : '+nn2);
    }
  }
  else if(a==='swapEx'){
    i=+t.dataset.ex; var E4=S.draft.ex[i], vl=variantsOf(E4.name);
    if(vl.length>1 && !E4.sets.some(function(x){return x.done;})){
      var ci=-1; vl.forEach(function(v,ix){if(norm(v)===norm(E4.name)) ci=ix;});
      var nn3=vl[(ci+1)%vl.length], rps3=String(E4.target).split('×')[1]||'8-12', inf3=lastInfo(nn3,rps3);
      E4.name=nn3; E4.info=inf3; E4.rated=false; E4.advice='';
      E4.sets.forEach(function(x){x.w=inf3?String(inf3.suggW).replace('.',','):'';});
      save();render();toast('Exercice changé : '+nn3+' — touche encore 🔄 pour voir une autre option.');
    }
  }
  else if(a==='expShow'){showExp=!showExp;render();}
  else if(a==='backupNow'){doBackup();}
  else if(a==='importDo'){try{var ob=JSON.parse(($('#imp').value||'').trim());if(!ob||!ob.program||!ob.sessions)throw 0;merge(ob);S.draft=null;save();render();toast('Sauvegarde restaurée ✅');}catch(e){toast('Texte invalide : colle toute la sauvegarde.');}}
  else if(a==='machToggle'){var mk2=t.dataset.k; if(nmach()[mk2]) delete nmach()[mk2]; else nmach()[mk2]=1; applyAvail(S.program); save(); render();}
  else if(a==='delset'){i=+t.dataset.ex;var arr2=S.draft.ex[i].sets;if(arr2.length>1){arr2.pop();save();render();}}
  else if(a==='addset'){i=+t.dataset.ex;var arr=S.draft.ex[i].sets,lastS=arr[arr.length-1];arr.push({w:lastS?lastS.w:'',r:'',done:false});save();render();}
  else if(a==='done'){
    i=+t.dataset.ex;j=+t.dataset.set;var E2=S.draft.ex[i], s=E2.sets[j];
    s.done=!s.done;
    if(s.done&&s.w){E2.sets.forEach(function(x,k){if(k>j&&!x.done&&!x.w)x.w=s.w;});}
    if(s.done&&!E2.info){var aj=adjW(E2); if(aj&&aj.w){E2.sets.forEach(function(x,k){if(k>j&&!x.done)x.w=String(aj.w).replace('.',',');});}}
    var allDone=E2.sets.every(function(x){return x.done;}), lastEx=(i===S.draft.ex.length-1);
    save(); render();
    if(s.done){
      if(allDone){ if(lastEx){restEnd=0;cancelBeep();updateRest();} else startRest(S.rest2||120,'Repos entre exercices'); }
      else startRest(S.rest1||60,'Repos entre séries');
    }
  }
  else if(a==='progAdd'){S.program[t.dataset.day].ex.push(ex('Nouvel exercice',3,'8-12'));save();render();}
  else if(a==='progDel'){S.program[t.dataset.day].ex.splice(+t.dataset.i,1);save();render();}
  else if(a==='progReset'){if(confirmTwice('progReset')){S.program=defaultProgram();S.cardioMin=(S.profile.goal==='muscle')?15:30;save();render();toast('Nouveau programme prêt ✅');}}
  else if(a==='bodyAdd'){
    var w=num($('#bW').value),wa=num($('#bWaist').value),dt=$('#bDate').value||ymd(new Date());
    if(w==null&&wa==null){toast('Entre un poids ou un tour de taille.');return;}
    S.body.push({id:uid(),date:dt,w:w,waist:wa}); save(); render(); toast('Mesure enregistrée ✅');
  }
  else if(a==='bodyDel'){if(confirmTwice('bd'+t.dataset.id)){S.body=S.body.filter(function(e){return e.id!==t.dataset.id;});save();render();}}
  else if(a==='cm'){S.cm=t.dataset.m;save();render();}
  else if(a==='sumOk'){S.summary=null;save();render();}
  else if(a==='theme'){S.theme=t.dataset.v==='light'?'light':'dark';save();render();}
  else if(a==='actAdd'){calAct=t.dataset.date;calAdd=null;calMove=null;render();}
  else if(a==='actCancel'){calAct=null;render();}
  else if(a==='actDel'){S.acts=(S.acts||[]).filter(function(x){return x.id!==t.dataset.id;});save();render();}
  else if(a==='actOk'){
    var an=($('#actName').value||'').trim()||'Activité', am=parseInt($('#actMin').value,10)||0, ak2=parseFloat(String($('#actKcal').value||'').replace(',','.'));
    if(am<=0){toast('Indique la durée en minutes.');return;}
    var est=!(ak2>0);
    S.acts=S.acts||[]; S.acts.push({id:uid(),date:t.dataset.date,name:an,min:am,kcal:est?actEstimate(am):Math.round(ak2),est:est});
    calAct=null;save();render();toast('Activité ajoutée ✅');
  }
  else if(a==='calAdd'){calAdd=t.dataset.date;calMove=null;render();}
  else if(a==='calAddCancel'){calAdd=null;render();}
  else if(a==='calAddOk'){
    var ak=$('#calKey').value; S.extras[t.dataset.date]=ak; var rf4=reflowDates([t.dataset.date]); calAdd=null; save(); render(); toast('Séance ajoutée ✅'+(rf4?' Planning réorganisé automatiquement.':' à la suite de ton programme'));
  }
  else if(a==='calSkip'){moveSession(t.dataset.date,'');var rf2=reflowDates([t.dataset.date]);save();render();toast(rf2?'Séance retirée. Planning réorganisé automatiquement.':'Séance retirée du planning.');}
  else if(a==='missTom'){var tn=freeDayFrom(ymd(addDays(new Date(),1)));moveSession(t.dataset.date,tn);var rf3=reflowDates([tn]);save();render();toast('Séance reportée au '+fmtDate(tn)+' ✅'+(rf3?' Planning réorganisé automatiquement.':''));}
  else if(a==='obdays'){var nn=+t.dataset.n;S.plan.days=DAYMAP[nn]||DAYMAP[3];S.perWeek=nn;S.moves={};S.over={};save();render();}
  else if(a==='obNext'){obStep=Math.min(3,obStep+1);render();window.scrollTo(0,0);}
  else if(a==='obPrev'){obStep=Math.max(0,obStep-1);render();window.scrollTo(0,0);}
  else if(a==='obset'){S.profile[t.dataset.f]=t.dataset.v;save();render();}
  else if(a==='obFinish'){
    var ow=num(obW!==null?obW:'');
    if(ow&&(curWeight()==null||Math.abs(ow-curWeight())>0.05)) S.body.push({id:uid(),date:ymd(new Date()),w:ow,waist:null});
    S.program=buildProgram(S.profile.goal||'both',S.profile.level||'novice',(S.plan.days||[0,2,4]).length);
    S.cardioMin=(S.profile.goal==='muscle')?15:30;
    S.moves={};S.over={}; S.extras={}; S.phase='prog'; S.plan.start=ymd(new Date());
    S.onboarded=true; tab='today'; save(); render(); window.scrollTo(0,0); toast('C’est parti ! 💪');
  }
  else if(a==='skipCalib'){if(confirmTwice('skipCalib')){S.phase='prog';S.plan.start=ymd(new Date());S.moves={};S.over={};save();render();toast('Programme démarré 💪');}}
  else if(a==='resetSessions'){if(confirmTwice('resetSessions')){S.sessions=[];S.draft=null;S.summary=null;S.moves={};S.over={};S.extras={};S.phase='calib';S.plan.start=ymd(new Date());restEnd=0;cancelBeep();tab='today';save();render();toast('Séances effacées. On repart de zéro ✅');}}
  else if(a==='resetAll'){if(confirmTwice('resetAll')){S=defaultState();ensureSeed();obStep=0;obW=null;tab='today';restEnd=0;cancelBeep();save();render();window.scrollTo(0,0);}}
  else if(a==='redoIntro'){S.onboarded=false;obStep=0;obW=null;save();render();}
  else if(a==='rir'){
    i=+t.dataset.ex; var E=S.draft.ex[i], s0=E.sets[0], w0=num(s0.w), r0=parseInt(s0.r,10);
    if(!w0||!r0){toast('Entre la charge et les reps de ta série test.');return;}
    var vv=t.dataset.v, f={A:0.92,B:1,C:1.08,D:1.18}[vv], nw=Math.round(w0*f/2.5)*2.5;
    if(f!==1&&nw===w0) nw+=(f>1?2.5:-2.5);
    if(nw<2.5) nw=2.5;
    var msg={A:'Un peu lourd : on baisse.',B:'Parfait.',C:'On monte un peu.',D:'On monte nettement.'}[vv];
    E.sets.forEach(function(x,k){if(k>0&&!x.done)x.w=String(nw).replace('.',',');});
    E.rated=true; E.advice='🎯 '+msg+' Charge conseillée : <b>'+fmt(nw)+' kg</b>.';
    save(); render();
  }
  else if(a==='calPrev'){calOff--;calMove=null;render();}
  else if(a==='calNext'){calOff++;calMove=null;render();}
  else if(a==='calToday'){calOff=0;calMove=null;render();}
  else if(a==='calMove'){calMove=t.dataset.date;calAdd=null;render();}
  else if(a==='calMoveCancel'){calMove=null;render();}
  else if(a==='calMoveOk'){
    var nd=$('#calDate').value, pm=plannedMap();
    if(!nd){toast('Choisis une date.');return;}
    if(pm[nd]&&nd!==calMove){toast('Une autre séance est déjà prévue ce jour-là.');return;}
    var fromD=calMove; moveSession(calMove,nd);
    var rf1=reflowDates([nd,fromD]);
    calMove=null; save(); render(); toast(rf1?'Séance décalée ✅ Planning réorganisé automatiquement pour limiter les mêmes muscles deux jours de suite':'Séance décalée ✅');
  }
  else if(a==='pday'){
    var di=+t.dataset.d, ds=S.plan.days||[], ix=ds.indexOf(di);
    if(ix>=0){ if(ds.length<=1){toast('Garde au moins un jour.');return;} ds.splice(ix,1); } else ds.push(di);
    ds.sort(); S.plan.days=ds; S.perWeek=ds.length; S.moves={};S.over={}; save(); render();
  }
  else if(a==='compAdd'){
    var cw=num($('#cW').value),cf=num($('#cFat').value),cmu=num($('#cMus').value),cab=num($('#cAbd').value),cv=num($('#cVisc').value),cd=$('#cDate').value||ymd(new Date());
    if(cw==null){toast('Entre au moins le poids.');return;}
    S.comp=S.comp.filter(function(e){return e.date!==cd;});
    S.comp.push({id:uid(),date:cd,w:cw,fat:cf,pct:(cf!=null?Math.round(cf/cw*1000)/10:null),mus:cmu,abd:cab,visc:cv});
    save(); render(); toast('Bilan enregistré ✅');
  }
  else if(a==='compDel'){if(confirmTwice('cd'+t.dataset.id)){S.comp=S.comp.filter(function(e){return e.id!==t.dataset.id;});save();render();}}
});

document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.dataset.f&&S.draft){S.draft.ex[+t.dataset.ex].sets[+t.dataset.set][t.dataset.f]=t.value;save();if(t.dataset.f==='w'){var pe=$('#pl'+t.dataset.ex);if(pe){var tv=num(t.value),tx=tv?platesTxt(tv):'';pe.textContent='🔩 '+(tx?'Disques : '+tx+' ('+fmt(tv)+' kg au total)':'Tape ton poids total : je te montre les disques de chaque côté.');}}}
  else if(t.dataset.pd){
    var p=S.program[t.dataset.pd], f=t.dataset.pf;
    if(t.dataset.pi!==undefined){var e=p.ex[+t.dataset.pi];e[f]=(f==='sets')?(parseInt(t.value,10)||t.value):t.value;}
    else p[f]=t.value;
    save();
  }
  else if(t.dataset.tw){S.targetWeight=t.value;save();}
  else if(t.dataset.note!==undefined){S.notes[t.dataset.note]=t.value;save();}
  else if(t.dataset.pr){S.profile[t.dataset.pr]=t.value;save();}
  else if(t.dataset.ob==='w'){obW=t.value;}
  else if(t.dataset.tm&&S.draft&&S.draft.tm){if(t.dataset.tm==='gym')S.draft.gym=t.value;else S.draft.tm[t.dataset.tm]=t.value;save();updateKcal();}
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='impFile'&&t.files&&t.files[0]){
    var fr=new FileReader();
    fr.onload=function(){try{var ob=JSON.parse(String(fr.result||'').trim());if(!ob||!ob.program||!ob.sessions)throw 0;merge(ob);S.draft=null;save();render();toast('Sauvegarde restaurée ✅');}catch(e){toast('Fichier invalide.');}};
    fr.readAsText(t.files[0]); return;
  }
  if(t.dataset.rs){S[t.dataset.rs]=parseInt(t.value,10)||60;save();}
  else if(t.dataset.tmt&&S.draft&&S.draft.tm){S.draft.tm[t.dataset.tmt]=t.value;save();render();}
  else if(t.dataset.prs){S.profile[t.dataset.prs]=t.value;save();render();}
  else if(t.dataset.pls){
    if(t.dataset.pls==='weeks') S.plan.weeks=parseInt(t.value,10)||8;
    else if(t.value) S.plan.start=t.value;
    S.moves={};S.over={}; save(); render();
  }
  else if(t.dataset.sel){S.sel=t.value;save();render();}
  else if(t.dataset.tw){render();}
});

initStore();
})();
